# Render Blueprint (Free Tier). Deploy: render.com -> New -> Blueprint ->
# dieses Repo auswählen. Env-Var-Werte (sync: false) trägst du danach im
# Render-Dashboard ein, nicht hier im Repo.
#
# RAM war laut Render-Metrics NICHT das Problem (weit unter 512MB).
# Tatsächlicher Engpass: Render Free Tier drosselt auf 0.15 CPU - siehe
# IBEAM_GATEWAY_STARTUP/RETRIES/TIMEOUT unten. Siehe docs/SETUP.md,
# Abschnitt "Bekannte Risiken" für den aktuellen Stand.
services:
  - type: web
    name: ib-gateway-paper
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # /v1/api/tickle antwortet manchmal nicht zuverlässig (404), solange
    # IBeam noch mit Login/Status-Checks beschäftigt ist. Render hielt
    # den Service deshalb für ungesund und startete ihn ständig neu,
    # bevor der Login überhaupt fertig laufen konnte ("lädt endlos,
    # startet von selbst neu" im Browser). "/" liefert die Login-Seite
    # selbst aus und antwortet unabhängig vom Auth-Status zuverlässig
    # mit 200 - reicht als reiner "Container lebt"-Check.
    healthCheckPath: /
    envVars:
      # IBeam/der Gateway öffnet neben 5000 (API) noch einen zweiten,
      # von IBeam selbst nicht dokumentierten Port 5001. Ohne festen
      # PORT-Wert erkennt Render das zur Laufzeit als "neuen primären
      # Port", schaltet mitten im Login-Vorgang um und startet den
      # Deploy neu - das riss die Selenium-Verbindung ab. Fest auf 5000
      # pinnen, damit Render nicht mehr umschaltet.
      - key: PORT
        value: "5000"
      - key: IBEAM_ACCOUNT
        sync: false
      - key: IBEAM_PASSWORD
        sync: false
      # Leer lassen, solange der Account nur IB-Key-Push nutzt (kein
      # TOTP-Secret verfügbar) - IBeam erwartet dann keinen 2FA-Handler
      # und wartet stattdessen auf die manuelle Push-Bestätigung. Nur
      # auf PYOTP setzen, wenn im IBKR-Konto ein Authenticator mit
      # echtem TOTP-Secret eingerichtet wurde.
      - key: IBEAM_TWO_FA_HANDLER
        sync: false
      - key: IBEAM_PYOTP_SECRET
        sync: false
      # Render Free Tier drosselt auf 0.15 CPU - der Java-Gateway-Prozess
      # braucht damit vermutlich deutlich länger als IBeams Standard-
      # Wartezeit (20s), bis seine API-Routen wirklich bereit sind.
      # Das erklärt die 404-Antworten auf /v1/api/tickle direkt nach dem
      # Start. Grosszügiger bemessen:
      - key: IBEAM_GATEWAY_STARTUP
        value: "180"
      - key: IBEAM_REQUEST_RETRIES
        value: "10"
      - key: IBEAM_REQUEST_TIMEOUT
        value: "30"
      # KRITISCH: Ohne das versucht IBeam den Login-Toggle auf der
      # IBKR-Seite auf "Live" zu lassen, obwohl wir Paper-Zugangsdaten
      # verwenden (per Config-Dump im Render-Log bestätigt:
      # USE_PAPER_ACCOUNT stand auf False). Vermutlich die eigentliche
      # Ursache aller bisherigen Login-Fehlschläge.
      - key: IBEAM_USE_PAPER_ACCOUNT
        value: "True"
