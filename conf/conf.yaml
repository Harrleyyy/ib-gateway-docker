# Basiert auf der ECHTEN Original-conf.yaml aus dem Gateway
# (copy_cache/clientportal.gw/root/conf.yaml im Voyz/ibeam-Repo). Unsere
# vorherige Version war eine Neuerstellung von Grund auf und hat dabei
# wichtige Einstellungen weggelassen - vor allem `proxyRemoteHost`
# (sagt dem Gateway, wohin API-Anfragen überhaupt weitergeleitet werden
# sollen) und den `webApps`-Block für die Login-Seite selbst. Das war
# vermutlich die eigentliche Ursache der 404-Antworten auf
# /v1/api/tickle und /sso/Login, nicht (nur) Timing/CPU.
#
# Zweite Abweichung vom Original: listenPort 10000 statt 5000.
# Render hielt trotz PORT=5000-Env-Var seinen eigenen Health-Check
# dauerhaft auf Port 10000 (Renders interner Default für Web-Services) -
# das Gateway lauscht deshalb jetzt direkt auf dem Port, den Render
# tatsächlich abfragt, statt zu versuchen Render umzustimmen.
ip2loc: "US"
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 10000
listenSsl: true
ccp: false
svcEnvironment: "v1"
sslCert: "vertx.jks"
sslPwd: "mywebapi"
authDelay: 3000
portalBaseURL: ""
serverOptions:
  blockedThreadCheckInterval: 1000000
  eventLoopPoolSize: 20
  workerPoolSize: 20
  maxWorkerExecuteTime: 100
  internalBlockingPoolSize: 20
cors:
  origin.allowed: "*"
  allowCredentials: false
webApps:
  - name: "demo"
    index: "index.html"

# Original hier: allow-Liste mit privaten IP-Bereichen + deny: [0.0.0.0/0]
# am Ende (alles andere sperren). Wir kehren das um, weil die Aufrufer
# (Claude-Code-Routine in der Cloud, UptimeRobot) keine feste,
# vorhersagbare IP haben - akzeptabel nur, weil hier ausschließlich ein
# Paper-Trading-Account ohne echtes Geld dahinterhängt. NICHT
# unverändert für ein Live-Konto übernehmen.
ips:
  allow:
    - 0.0.0.0/0
  deny: []
