# Angepasste Gateway-Konfiguration für den Betrieb auf Render (Free Tier).
#
# 1. listenSsl: true (IBeam-Standard, NICHT abschalten)
#    Ursprünglich hatten wir hier auf false gestellt, in der Annahme,
#    Render würde TLS selbst terminieren und intern per HTTP weiterleiten.
#    Per Render-Deploy-Log bestätigt falsch: IBeams eigene
#    Login-Automatisierung (Selenium + interner Status-Check) lädt intern
#    fest "https://localhost:5000/..." - mit listenSsl: false bricht das
#    mit SSL-Handshake-Fehlern ab (net::ERR_CONNECTION_CLOSED). Deshalb
#    zurück auf HTTPS mit dem von IBKR mitgelieferten selbstsignierten
#    Zertifikat. Externe Aufrufer (gateway_client.py, UptimeRobot) nutzen
#    ohnehin Renders öffentliche HTTPS-URL mit gültigem Zertifikat -
#    ob/wie Render intern zu diesem HTTPS-Port durchreicht, ist der
#    nächste zu verifizierende Punkt (siehe docs/SETUP.md).
#
# 2. ips.allow enthält 0.0.0.0/0
#    Die Aufrufer (Claude-Code-Routine in der Cloud, UptimeRobot-Pinger)
#    haben keine feste, vorhersagbare IP. Das öffnet die Gateway-API für
#    beliebige Absender, die die Render-URL kennen - akzeptabel nur, weil
#    hier ausschließlich ein Paper-Trading-Account ohne echtes Geld
#    dahinterhängt. NICHT unverändert für ein Live-Konto verwenden.
listenPort: 5000
listenSsl: true

cors:
  origin.allowed: "*"

ips:
  allow:
    - 0.0.0.0/0
  deny: []
